<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Regent Coffee — Team Portal</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; background: #1C3028; min-height: 100vh; }

/* LOCK */
#lock { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 24px; }
#lock h1 { font-size: 28px; font-weight: 300; color: #F5F0E8; text-align: center; margin-bottom: 8px; }
#lock p { font-size: 12px; color: #C8B99A; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 48px; }
#pw { display: block; width: 100%; max-width: 280px; padding: 18px; font-size: 20px; text-align: center; letter-spacing: 0.2em; border: 2px solid rgba(255,255,255,0.2); border-radius: 14px; background: rgba(255,255,255,0.08); color: #F5F0E8; outline: none; margin-bottom: 14px; -webkit-appearance: none; }
#pw:focus { border-color: #C8B99A; }
#unlock-btn { display: block; width: 100%; max-width: 280px; padding: 18px; font-size: 16px; font-weight: 600; background: #C8B99A; color: #1C3028; border: none; border-radius: 14px; cursor: pointer; -webkit-appearance: none; }
#unlock-btn:active { background: #b0a488; }
#err { color: #E07070; font-size: 14px; margin-top: 14px; min-height: 20px; text-align: center; }

/* APP */
#app { display: none; background: #F5F0E8; min-height: 100vh; }

.top-bar { background: #1C3028; padding: 50px 20px 16px; display: flex; justify-content: space-between; align-items: flex-end; }
.top-bar h2 { font-size: 22px; font-weight: 300; color: #F5F0E8; }
.top-bar button { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 8px 14px; color: #C8B99A; font-size: 13px; cursor: pointer; -webkit-appearance: none; }

.filters { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; background: #EAE3D6; border-bottom: 1px solid rgba(0,0,0,0.06); }
.filters::-webkit-scrollbar { display: none; }
.filters button { flex-shrink: 0; padding: 8px 16px; border-radius: 99px; font-size: 13px; font-weight: 500; border: 1.5px solid rgba(0,0,0,0.1); background: #fff; color: #444; cursor: pointer; -webkit-appearance: none; }
.filters button.on { background: #1C3028; color: #F5F0E8; border-color: #1C3028; }

.list { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card { background: #fff; border-radius: 14px; padding: 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; border: none; width: 100%; text-align: left; -webkit-appearance: none; }
.card:active { background: #EAE3D6; }
.cid { font-size: 11px; font-weight: 600; color: #999; min-width: 52px; }
.cinfo { flex: 1; }
.ctitle { font-size: 14px; font-weight: 500; color: #1a1a1a; line-height: 1.35; margin-bottom: 5px; }
.cmeta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.cscope { font-size: 11px; color: #999; }
.arr { color: #ccc; font-size: 20px; }

.badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
.bp { background: #E1F5EE; color: #085041; }
.bf { background: #FAECE7; color: #712B13; }
.bt { background: #EAF3DE; color: #27500A; }
.bs { background: #FAEEDA; color: #633806; }
.bo { background: #E6F1FB; color: #0C447C; }

/* DETAIL */
#detail { display: none; background: #F5F0E8; min-height: 100vh; }
.dbar { background: #1C3028; padding: 50px 16px 16px; display: flex; align-items: flex-start; gap: 12px; position: sticky; top: 0; z-index: 5; }
.dbar button { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; width: 40px; height: 40px; font-size: 20px; color: #F5F0E8; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; -webkit-appearance: none; }
.dbar-info { flex: 1; }
.did { font-size: 10px; color: #C8B99A; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 3px; }
.dtitle { font-size: 18px; font-weight: 400; color: #F5F0E8; line-height: 1.3; }

.dbody { padding: 20px 16px 60px; }
.dmeta { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
.dscope { font-size: 12px; color: #999; }

.sec { margin-bottom: 26px; }
.sec-title { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #2E5041; padding-bottom: 7px; border-bottom: 1.5px solid #EAE3D6; margin-bottom: 10px; }
.sec p { font-size: 15px; color: #4A4A4A; line-height: 1.65; }

ul.dlist { list-style: none; }
ul.dlist li { font-size: 15px; color: #4A4A4A; line-height: 1.55; padding: 9px 0 9px 20px; position: relative; border-bottom: 1px solid #EAE3D6; }
ul.dlist li:last-child { border-bottom: none; }
ul.dlist li::before { content: '—'; position: absolute; left: 0; color: #C8B99A; }

table.dtable { width: 100%; border-collapse: collapse; font-size: 14px; }
table.dtable th { text-align: left; font-size: 11px; font-weight: 600; color: #999; padding: 8px 10px; background: #EAE3D6; }
table.dtable td { padding: 10px; border-bottom: 1px solid #EAE3D6; color: #4A4A4A; vertical-align: top; }

.box-green { background: #1C3028; color: #F5F0E8; border-radius: 12px; padding: 14px 16px; font-size: 14px; line-height: 1.6; margin-bottom: 10px; }
.box-red { background: #FFF4F0; border-left: 3px solid #C0392B; border-radius: 0 10px 10px 0; padding: 12px 14px; font-size: 14px; color: #5A1A1A; line-height: 1.6; }
.box-blue { background: #F0F5FF; border-left: 3px solid #3B6FD4; border-radius: 0 10px 10px 0; padding: 12px 14px; font-size: 14px; color: #1A2E5A; line-height: 1.6; }
</style>
</head>
<body>

<!-- LOCK -->
<div id="lock">
  <h1>Regent Coffee<br>Team Portal</h1>
  <p>Internal Use Only</p>
  <input id="pw" type="password" placeholder="passcode" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
  <button id="unlock-btn" onclick="unlock()">Unlock</button>
  <div id="err"></div>
</div>

<!-- APP -->
<div id="app">
  <div class="top-bar">
    <h2>Regent Coffee</h2>
    <button onclick="lockApp()">Lock</button>
  </div>
  <div class="filters">
    <button class="on" onclick="filter('all',this)">All</button>
    <button onclick="filter('Product',this)">Product</button>
    <button onclick="filter('Staff',this)">Staff</button>
    <button onclick="filter('Ops',this)">Ops</button>
    <button onclick="filter('Facilities',this)">Facilities</button>
    <button onclick="filter('Training',this)">Training</button>
  </div>
  <div class="list" id="list"></div>
</div>

<!-- DETAIL -->
<div id="detail">
  <div class="dbar">
    <button onclick="back()">←</button>
    <div class="dbar-info">
      <div class="did" id="d-id"></div>
      <div class="dtitle" id="d-title"></div>
    </div>
  </div>
  <div class="dbody" id="d-body"></div>
</div>

<script>
const PW = "regent2024";

document.getElementById('pw').addEventListener('keydown', function(e){ if(e.key==='Enter') unlock(); });

function unlock(){
  var v = document.getElementById('pw').value.trim().toLowerCase();
  if(v === PW){
    document.getElementById('lock').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('err').textContent = '';
    document.getElementById('pw').value = '';
    renderList(POLICIES);
  } else {
    document.getElementById('err').textContent = 'Wrong passcode, try again.';
    document.getElementById('pw').value = '';
    document.getElementById('pw').focus();
  }
}

function lockApp(){
  document.getElementById('app').style.display = 'none';
  document.getElementById('detail').style.display = 'none';
  document.getElementById('lock').style.display = 'flex';
}

function filter(cat, el){
  document.querySelectorAll('.filters button').forEach(function(b){ b.classList.remove('on'); });
  el.classList.add('on');
  renderList(cat==='all' ? POLICIES : POLICIES.filter(function(p){ return p.cat===cat; }));
}

function renderList(list){
  document.getElementById('list').innerHTML = list.map(function(p){
    return '<button class="card" onclick="openDetail(\''+p.id+'\')">'+
      '<div class="cid">'+p.id+'</div>'+
      '<div class="cinfo">'+
        '<div class="ctitle">'+p.title+(p.ver?' <span style="font-size:11px;color:#999;font-weight:400">'+p.ver+'</span>':'')+'</div>'+
        '<div class="cmeta"><span class="badge '+p.badge+'">'+p.cat+'</span><span class="cscope">'+p.scope+'</span></div>'+
      '</div>'+
      '<div class="arr">›</div>'+
    '</button>';
  }).join('');
}

function openDetail(id){
  var p = POLICIES.find(function(x){ return x.id===id; });
  if(!p) return;
  document.getElementById('d-id').textContent = p.id;
  document.getElementById('d-title').textContent = p.title;
  document.getElementById('d-body').innerHTML =
    '<div class="dmeta"><span class="badge '+p.badge+'">'+p.cat+'</span><span class="dscope">'+p.scope+'</span>'+(p.ver?'<span class="dscope">'+p.ver+'</span>':'')+'</div>'+
    p.html;
  document.getElementById('app').style.display = 'none';
  document.getElementById('detail').style.display = 'block';
  window.scrollTo(0,0);
}

function back(){
  document.getElementById('detail').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  window.scrollTo(0,0);
}

var POLICIES = [
  {id:"POL-001",title:"Retail Bean Purchase Policy",cat:"Product",badge:"bp",scope:"In-shop",html:`
    <div class="sec"><div class="sec-title">Complimentary Brew with Bean Purchase</div>
    <p>Customers who purchase retail coffee beans receive one complimentary pour-over from the same tier.</p><br>
    <table class="dtable"><thead><tr><th>Bean Tier</th><th>Complimentary Brew</th></tr></thead><tbody>
    <tr><td>Tier 1</td><td>Tier 1 pour-over</td></tr>
    <tr><td>Tier 2</td><td>Tier 2 pour-over</td></tr>
    <tr><td>Tier 3</td><td>Tier 3 pour-over</td></tr>
    </tbody></table></div>
    <div class="sec"><div class="sec-title">Tier Definitions</div><ul class="dlist">
    <li><strong>Tier 1</strong> — Classic coffees: washed, natural, honey process</li>
    <li><strong>Tier 2</strong> — Barrel-aged and select anaerobic fermented coffees</li>
    <li><strong>Tier 3</strong> — Complex processing: co-ferment, yeast ferment, thermo shock, mossto</li>
    </ul></div>
    <div class="sec"><div class="sec-title">Top Unique Tier</div>
    <div class="box-red">No complimentary pour-over with Top Unique purchases. Limited, higher-end coffees — team will be notified when in stock.<br><br><strong>Current Top Unique: Honey Gesha</strong></div></div>
    <div class="sec"><div class="sec-title">Pour-Over Substitutions</div>
    <p>If a customer doesn't want to wait, offer an americano or drip coffee instead. Always align with the current menu.</p></div>
    <div class="sec"><div class="sec-title">Questions?</div><p>If unsure which tier a coffee belongs to, ask the manager.</p></div>
    <div class="sec"><div class="sec-title">Coffee Tier Reference Sheet</div>
    <a href="https://docs.google.com/spreadsheets/d/1L1RMTIVZuqjb_adLVmPz6Dn_Tg3OBFiWjK99o_zrBYs/edit?usp=sharing" target="_blank" style="display:block;background:#1C3028;color:#F5F0E8;text-decoration:none;padding:14px 16px;border-radius:12px;font-size:14px;text-align:center;">📋 View Coffee Tier Reference Sheet ↗</a></div>`
  },
  {id:"POL-002",title:"AC Usage Guidelines",cat:"Facilities",badge:"bf",scope:"Both locations",html:`
    <div class="sec"><div class="sec-title">Fan Mode</div>
    <p>Do not use or change the fan mode. It does not improve cooling and may affect system performance.</p><br>

  {id:"POL-003",title:"Product Sharing & Sampling Guide",cat:"Training",badge:"bt",scope:"Both locations",ver:"v1.1",html:`
    <div class="sec"><div class="sec-title">Mindset</div>
    <div class="box-green">We are not salespeople. We are producers.<br>Share. Guide. Don't pressure.</div></div>
    <div class="sec"><div class="sec-title">When to Sample</div><ul class="dlist">
    <li>Guest says "this is really good"</li>
    <li>Guest shows curiosity about how we make things</li>
    <li>Guest mentions brewing at home</li>
    <li>Guest is waiting and chatting</li>
    <li>Regular customers who already trust us</li>
    <li>Slower hours when you have time to explain</li>
    </ul></div>
    <div class="sec"><div class="sec-title">A · Pour-Over Pouch</div>
    <p><strong>How:</strong> Brew one pouch into a carafe and share small portions.</p><br>
    <div class="box-blue"><strong>Say:</strong> "This is our pour-over pouch. We sift out the fines, so the cup is cleaner."<br><br>If they ask more: removing particles under 300 microns reduces over-extraction, slows oxidation. Estimated shelf life up to 6 months. Stop there.</div></div>
    <div class="sec"><div class="sec-title">B · Bottle — Liquid Espresso Concentrate</div>
    <p><strong>How:</strong> Serve a small 1:2 dilution over ice.</p><br>
    <div class="box-blue"><strong>Say:</strong> "This is our liquid espresso concentrate. We roast, extract, thermo-process, and bottle it in-house."<br><br>Add: extended shelf life at room temp for at least 1 year. Refrigerate immediately once opened.<br><br>Optional: "It's like a coffee base spirit. You can build drinks with it."</div></div>
    <div class="sec"><div class="sec-title">C · Cold Brew Can</div>
    <p><strong>How:</strong> Open one chilled can, serve small portions over ice. Use same can throughout shift — refrigerate after opening.</p><br>
    <div class="box-blue"><strong>Say:</strong> "This is our canned barrel-aged cold brew. Four single-origin barrel-aged coffees. Extended shelf life for at least one year."</div></div>
    <div class="sec"><div class="sec-title">How to Talk About Process</div>
    <div class="box-green">"We control everything from green bean to final product."<br><br>If they lean in: "Our barrel aging is sensory-controlled. We monitor aroma development carefully before roasting." Stop there.</div>
    <p style="margin-top:10px">If they don't lean in — smile and move on.</p></div>
    <div class="sec"><div class="sec-title">What We Do NOT Share</div>
    <div class="box-red">Never disclose: exact aging duration · rotation methods · barrel conditioning details · extraction ratios · processing parameters<br><br>We share philosophy, not formulas.</div></div>`
  },
  {id:"POL-004",title:"Scheduling & Shift Guidelines",cat:"Staff",badge:"bs",scope:"Both locations",html:`
    <div class="sec"><div class="sec-title">Changing Availability</div>
    <p>Submit at least <strong>two weeks in advance</strong>. Scheduling manager will review and approve based on operational needs.</p></div>
    <div class="sec"><div class="sec-title">Days Off Requests</div><ul class="dlist">
    <li>Vacation days — at least one month in advance</li>
    <li>Personal days — two weeks' notice required</li>
    </ul><p style="margin-top:10px">Approved based on staffing needs, first-come first-served.</p></div>
    <div class="sec"><div class="sec-title">Shift Swaps</div>
    <p>Allowed if both parties agree. Must be approved by scheduling manager at least <strong>24 hours before the shift</strong>.</p></div>
    <div class="sec"><div class="sec-title">Emergency Cover</div>
    <div class="box-blue">Notify the scheduling manager as soon as possible. Management will coordinate coverage or adjust schedule.</div></div>
    <div class="sec"><div class="sec-title">Breaks</div><ul class="dlist">
    <li>Rest and meal breaks must comply with labor laws</li>
    <li>10-minute rest breaks cannot be stacked with 30-minute meal breaks</li>
    <li>Take breaks separately to maintain coverage</li>
    <li>If timing is difficult, check in with shift lead or manager</li>
    </ul></div>
    <div class="sec"><div class="sec-title">General Compliance</div>
    <div class="box-red">Stick to your scheduled shifts and approved break times unless cleared by management. Repeated failure may lead to corrective action.</div></div>`
  },
  {id:"POL-005",title:"Bottled Concentrate: Thermo-Process & Storage",cat:"Product",badge:"bp",scope:"Both locations",html:`
    <div class="sec"><div class="sec-title">What Thermo-Processing Means</div>
    <p>The bottled coffee concentrate is heat-treated after brewing to give it an extended shelf life at room temperature — no preservatives used.</p></div>
    <div class="sec"><div class="sec-title">Storage Guidelines</div>
    <table class="dtable"><thead><tr><th>Condition</th><th>Guidance</th></tr></thead><tbody>
    <tr><td>Unopened</td><td>Room temperature, at least 3 months</td></tr>
    <tr><td>After opening</td><td>Refrigerate immediately</td></tr>

    <div class="sec"><div class="sec-title">Product Philosophy</div>
    <p>Designed to balance safety, convenience, and flavor — keeping the product as clean and minimal as possible.</p></div>`
  },
  {id:"POL-006",title:"Virtu Product Receiving Policy",cat:"Ops",badge:"bo",scope:"Both locations",html:`

  ,{id:"POL-008",title:"Espresso Dialing Method",cat:"Training",badge:"bt",scope:"Both locations",html:`
    <div class="sec"><div class="sec-title">The Regent Workflow</div>
    <div class="box-green" style="font-size:16px;text-align:center;letter-spacing:0.05em"><strong>LOOK → ADJUST FLOW → TASTE → ADJUST ACIDITY → DONE</strong></div></div>
    <div class="sec"><div class="sec-title">Core Principles</div><ul class="dlist">
    <li>Standards are starting points, not rules</li>
    <li>Change only <strong>one variable at a time</strong></li>
    <li>Use numbers as references, not final goals</li>
    <li>Look first. Taste second.</li>
    <li>Solve one problem at a time</li>
    <li>Ratio gives a starting point. Taste and purpose determine the final espresso</li>
    </ul></div>
    <div class="sec"><div class="sec-title">What We Can Control</div>
    <p>Main working variables: <strong>Grind Size / Dose / Yield</strong></p><br>
    <p>Water temperature is left unchanged during normal daily dialing.</p></div>
    <div class="sec"><div class="sec-title">Starting Point</div>
    <p>At Regent we use <strong>21g baskets</strong> with a working dose range of <strong>18–21g</strong>.</p><br>
    <p>Start around a <strong>1:2 brew ratio</strong> — e.g. 20g coffee in → ~40g espresso out. This is a reference point, not a rule.</p></div>
    <div class="sec"><div class="sec-title">Step 1 · Watch the Flow</div>
    <div class="box-red" style="margin-bottom:10px"><strong>LATE + SLOW</strong> → too much resistance<br>→ Grind <strong>coarser</strong> OR <strong>reduce dose</strong><br><br>Shot will taste: bitter, harsh, heavy</div>
    <div class="box-blue"><strong>EARLY + FAST</strong> → too little resistance<br>→ Grind <strong>finer</strong> OR <strong>increase dose</strong><br><br>Shot will taste: sour, thin, watery</div></div>
    <div class="sec"><div class="sec-title">Step 2 · Look for a Healthy Extraction</div>
    <p>A good extraction has:</p><br><ul class="dlist">
    <li>Stable, controlled flow</li>
    <li>Viscous texture</li>
    <li>Rich golden-brown color</li>
    <li>~25 seconds for ~40g yield (reference only — some great shots run 30+s)</li>
    </ul><br><p>When the flow looks good — <strong>visual dialing is done</strong>. Stop adjusting numbers.</p></div>
    <div class="sec"><div class="sec-title">Step 3 · Taste — Focus on Acidity First</div>
    <p>Don't analyze everything at once. Ask one question:</p><br>
    <div class="box-green"><strong>Is the acidity balanced, or too sharp?</strong><br><br>If balanced → you may be done.<br>If too sharp/aggressive/sour → move to Step 4.</div></div>
    <div class="sec"><div class="sec-title">Step 4 · If Acidity Is Too Sharp</div>
    <p>Choose ONE of the following. Do not do both at once.</p><br>
    <div class="box-blue" style="margin-bottom:10px"><strong>Method A — Increase Yield</strong><br>Let slightly more espresso out.<br>e.g. 18g in → 40g out becomes 18g in → 43–45g out<br>Then taste again.</div>
    <div class="box-blue"><strong>Method B — Reduce Dose Slightly</strong><br>e.g. 19g → 18.5g, or 18.5g → 18g<br>A small reduction shifts extraction balance.<br>Then taste again.</div></div>
    <div class="sec"><div class="sec-title">Step 5 · Stop When It Tastes Good</div>
    <div class="box-green">Does this espresso taste good, and does it work for the drink we are making?<br><br>If yes — <strong>the espresso is dialed.</strong></div><br>
    <p>Do not keep changing parameters because the numbers don't look theoretically perfect.</p></div>
    <div class="sec"><div class="sec-title">Taste Evaluation — Simple Version</div>
    <p>If you can't identify every flavor yet, start here:</p><br><ul class="dlist">
    <li>Is it balanced between acidity, sweetness, and bitterness?</li>
    <li>It should not be overwhelmingly sour or bitter</li>
    <li>If you can clearly perceive sweetness, that is a positive sign</li>
    </ul><br><p>As you get more familiar: <strong>Balance → Sweetness → Detailed flavor evaluation</strong></p></div>`
  }
  ,{id:"POL-009",title:"Post-Process Program",cat:"Training",badge:"bt",scope:"Both locations",html:`
    <div class="sec"><div class="sec-title">The Regent System</div>
    <p style="margin-bottom:10px">Normally, processing at origin is complete before green coffee arrives at a roastery. At Regent, we add another intentional stage <strong>after</strong> arrival but <strong>before</strong> roasting.</p>
    <div class="box-green" style="margin-bottom:8px"><strong>Standard:</strong> SOURCE → WASHED / NATURAL / HONEY → GREEN COFFEE → ROAST</div>
    <div class="box-green"><strong>Regent:</strong> SOURCE → POST-PROCESS → ROAST → BREW</div></div>
    <div class="sec"><div class="sec-title">Why We Do It</div>
    <p>The goal is not simply to "add flavor." We want to explore: <em>once processing at origin is complete, can we continue developing the coffee before roasting and create a new expression of it?</em></p><br>
    <ul class="dlist">
    <li>What does the original coffee taste like?</li>
    <li>What direction do we want to take it?</li>
    <li>What kind of post-process works with that coffee?</li>
    <li>How long should we process it?</li>
    <li>How should we roast it afterward?</li>
    </ul><br>
    <p>Not every process works with every coffee. <strong>The coffee itself always comes first.</strong></p></div>
    <div class="sec"><div class="sec-title">Barrel Aging</div>
    <p>We age green coffee in <strong>new American oak / Kentucky bourbon barrels</strong> for around <strong>two months</strong> before roasting.</p><br>
    <div class="box-blue">We are not pouring bourbon into the coffee. The green coffee interacts with the barrel and develops characteristics of oak, vanilla, spice, and bourbon-like aromatics. The finished brewed coffee is <strong>non-alcoholic</strong>.</div><br>
    <p>Applied to coffees from Ethiopia, Kenya, Mexico, and others — each origin interacts differently with the same process.</p></div>
    <div class="sec"><div class="sec-title">Infusion & Experimental Series</div>
    <p>We explore different ingredients and aromatic materials. Past experiments:</p><br>
    <ul class="dlist">
    <li><strong>EXP004</strong> — Rose Infusion · Ethiopia Guji Hambela Washed</li>
    <li><strong>EXP006</strong> — Strawberry Vodka Infused "Bubble Gum" · Burundi Kayanza Masha</li>
    <li><strong>EXP009</strong> — Strawberry Infusion</li>
    <li>Osmanthus and other ingredients also explored</li>
    </ul><br>
    <p>The goal is not to make coffee taste like syrup. We study how different ingredients interact with green coffee — and how roasting transforms those characteristics afterward.</p><br>
    <a href="https://regentcoffee.com/collections/post-process-experimental-batches" target="_blank" style="display:block;background:#1C3028;color:#F5F0E8;text-decoration:none;padding:14px 16px;border-radius:12px;font-size:14px;text-align:center;">🧪 View EXP Batches Log ↗</a></div>
    <div class="sec"><div class="sec-title">Post-Process vs. Flavored Coffee</div>
    <p>Many traditional flavored coffees have flavoring added <strong>after</strong> roasting. Ours is different:</p><br>
    <div class="box-green" style="margin-bottom:8px">❌ Coffee + Flavor = Flavored Coffee</div>
    <div class="box-green">✓ Coffee + Post-Process + Roasting = <strong>A New Expression of the Coffee</strong></div></div>
    <div class="sec"><div class="sec-title">Why Roasting Still Matters</div>
    <p>Post-Process doesn't end when the green coffee treatment finishes. The coffee has changed — so we reconsider how we roast it.</p><br>
    <p>A successful Post-Process coffee should still feel like coffee and connect to its origin, while showing flavors that would be difficult to achieve through roasting alone.</p><br>
    <div class="box-green"><strong>PROCESS DESIGN + ROASTING = FINAL FLAVOR DESIGN</strong></div></div>
    <div class="sec"><div class="sec-title">How to Explain It to Customers</div>
    <div class="box-blue" style="margin-bottom:10px"><strong>Simple version:</strong><br>"Post-process means we do an additional process to the green coffee here at Regent before roasting it. We use methods like barrel aging and infusion to explore flavors that wouldn't normally develop through roasting alone."</div>
    <div class="box-blue"><strong>If they want more:</strong><br>"It's part of how we approach coffee creatively. We start with the coffee itself, design a post-process around it, and then develop a roast specifically for that coffee."</div><br>
    <p>This connects to the idea behind Regent: <strong>"Some coffee is discovered, some is created."</strong></p><br>
    <ul class="dlist">
    <li><strong>Discovered</strong> — origin, variety, terroir, processing, natural character</li>
    <li><strong>Created</strong> — what we intentionally develop through POST-PROCESS → ROAST → BREW</li>
    </ul></div>
    <div class="sec"><div class="sec-title">The One Thing to Remember</div>
    <div class="box-green">Post-Process is not simply about adding flavor to coffee. It is about adding another intentional layer of processing before roasting to create a new expression of the coffee.</div></div>`
  }

    <div class="sec"><div class="sec-title">What Is The Regent System?</div>
    <p>The Regent System explains how we think about coffee at Regent.</p><br>
    <p>At the center of everything is <strong>coffee</strong>. Around it are the different things we do with it — from understanding where it comes from, to changing it, roasting it, brewing it, and turning it into different products and experiences.</p><br>
    <div class="box-green"><strong>The Regent System is not a fixed sequence. It is a connected system.</strong><br>Each part can influence the others.</div></div>
    <div class="sec"><div class="sec-title">SOURCE — Understand What Is Already There</div>
    <p>Everything starts with the coffee itself. We look at its origin, producer, variety, processing method, terroir, seasonality, and natural flavor characteristics.</p><br>
    <p>Before deciding what to do with a coffee, we first need to understand what it already has. Some coffees may be beautiful exactly as they are. Others may inspire us to experiment.</p><br>
    <div class="box-blue">The question: <strong>What does this coffee already have?</strong><br><br>This is the "discovered" side of Regent.</div></div>
    <div class="sec"><div class="sec-title">POST-PROCESS — Explore What Else Is Possible</div>
    <p>Post-Process is where we intentionally work with green coffee after processing at origin but before roasting. This includes: Barrel Aging · Infusion · Aromatic Processing · Experimental Processing.</p><br>
    <p>Post-Process is not something every coffee needs. It is a tool available to us when we believe there is an interesting direction worth exploring.</p><br>
    <div class="box-blue">The question: <strong>What else could this coffee become?</strong><br><br>This is the "created" side of Regent.</div></div>
    <div class="sec"><div class="sec-title">ROAST — Develop the Idea</div>
    <p>Roasting connects what exists in the green coffee with what we ultimately want people to experience. We don't simply ask "how light or dark?" We ask: <strong>"What are we trying to express?"</strong></p><br>
    <p>The answer may be different depending on whether the coffee is intended for: Pour-over · Espresso · Cold Brew · Concentrate · Post-Process Coffee · Blend</p><br>
    <p>Roasting is not just production. <strong>Roasting is part of product development.</strong></p></div>
    <div class="sec"><div class="sec-title">BREW — Find the Best Expression</div>
    <p>Brewing is where roasted coffee becomes something we can actually experience. We work with: Water · Grind · Ratio · Temperature · Time · Extraction · Texture.</p><br>
    <p>But Brew doesn't only mean making a drink for a customer. Our brewing knowledge also helps us develop products — Cold Brew, Liquid Espresso Concentrate, Ready Brew Pouches.</p><br>
    <div class="box-blue">The question: <strong>How should this coffee be expressed?</strong></div></div>
    <div class="sec"><div class="sec-title">PRODUCT — Where the System Becomes Tangible</div>
    <p>Our products are not separate from The Regent System. They are physical expressions of it.</p><br>
    <ul class="dlist">
    <li><strong>Whole Bean</strong> — Source + Roast</li>
    <li><strong>Post-Process Coffee</strong> — Source + Post-Process + Roast</li>
    <li><strong>Cold Brew</strong> — Source + Roast + Extraction</li>
    <li><strong>Liquid Espresso Concentrate</strong> — coffee, roast, extraction, filtration, production</li>
    <li><strong>Ready Brew Pouches</strong> — brewing knowledge translated into a convenient product</li>
    <li><strong>Blends</strong> — combining coffees intentionally to create a particular expression</li>
    </ul><br>
    <div class="box-green">Sometimes: COFFEE → IDEA → PRODUCT<br>Sometimes: PRODUCT IDEA → BREW → ROAST → SOURCE<br><br>That's why it's a system, not a straight line.</div></div>
    <div class="sec"><div class="sec-title">"Some coffee is discovered, some is created."</div>
    <div class="box-blue" style="margin-bottom:10px"><strong>DISCOVERED</strong><br>Sometimes our job is to understand something that already exists — a beautiful origin, an unusual variety, a flavor already present in the coffee. We try to reveal it.</div>
    <div class="box-blue"><strong>CREATED</strong><br>Other times we ask: what else is possible? Through Post-Process, Roasting, Blending, Extraction, Brewing, Product Development — we create something new from what we have learned.<br><br>"Created" doesn't mean covering up the coffee. It means making intentional choices with it.</div></div>
    <div class="sec"><div class="sec-title">How to Read This System</div>
    <p>Don't memorize it as a list. Think of it as a set of questions:</p><br>
    <ul class="dlist">
    <li><strong>SOURCE</strong> — What does this coffee already have?</li>
    <li><strong>POST-PROCESS</strong> — What else could it become?</li>
    <li><strong>ROAST</strong> — How should we develop it?</li>
    <li><strong>BREW</strong> — How should we express it?</li>
    <li><strong>PRODUCT</strong> — What can we create from it?</li>
    </ul><br>
    <p>And then the process can start again. A new product teaches us something about brewing. Brewing teaches us something about roasting. Roasting teaches us something about a coffee. That discovery may inspire the next experiment.</p></div>
    <div class="sec"><div class="sec-title">The Most Important Lesson</div>
    <div class="box-green">The Regent System is our way of thinking, not just our way of producing coffee.<br><br>We don't only ask: "How do we make this?"<br>We also ask: "Why are we making it this way?"<br><br>Start with curiosity.<br>Understand what is there. Explore what is possible. Create with intention.<br><br><strong>some coffee is discovered, some is created.</strong></div></div>`
